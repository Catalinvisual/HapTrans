name: haptrans_driver
description: HapTrans Driver Mobile App
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # HTTP & WebSocket
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1
  
  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Location
  geolocator: ^11.0.0
  
  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  file_picker: ^8.0.2
  
  # Utils
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  
  # Camera & files
  permission_handler: ^11.3.1
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  
  # Navigation & URL
  url_launcher: ^6.2.6
  
  # Scanner
  flutter_local_notifications: ^17.2.4
  badges: ^3.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_mlkit_document_scanner: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
